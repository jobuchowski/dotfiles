set -g mouse on
set -g history-limit 50000
set -g status-interval 5

# tmux's default copy-mode wheel bindings scroll 5 lines per tick, which
# feels jumpy compared to kitty's native per-line scrolling. Scroll 1 line
# per tick instead, for both key tables in case mode-keys ever changes.
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

set -g status-style 'bg=default,fg=white'

set -g status-left-length 50
set -g status-left '#[bold,fg=green] #S #[fg=yellow]#{?window_zoomed_flag,[ZOOM],} #[default]'

set -g status-right-length 100
set -g status-right '#[fg=magenta]#{pane_current_command} #[fg=cyan]#H #[fg=yellow]%Y-%m-%d #[fg=green]%H:%M '

set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bold,reverse] #I:#W #[default]'

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
